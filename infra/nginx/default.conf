
# C07 - Gateway publico de BiblioTech.
# Este archivo se incluye dentro del contexto 'http' de nginx.conf.
# En esta etapa solo existe ms-identidad.

upstream identidad_publica {
    zone identidad_publica 64k;

    # Docker DNS: actualiza la IP si se recrea ms-identidad.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ms-identidad:8000 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 1. Rutas internas: nunca accesibles mediante el gateway.
    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # 2. Lista exacta de rutas publicas que pertenecen a Identidad:
    #    GET  /health/live/ y /health/ready/
    #    POST /api/auth/login/ y /api/auth/logout/
    #    GET  /api/auth/me/
    #    GET  /api/auth/access/bibliotecario/ y /lector/
    #    GET, POST /api/usuarios/
    #    GET, PATCH /api/usuarios/<id>/
    #    GET  /api/roles/
    # Nginx decide el servicio; Django decide metodos, tokens y permisos.
    location ~ ^/(?:health/(?:live|ready)|api/(?:auth/(?:login|logout|me|access/(?:bibliotecario|lector))|usuarios(?:/[0-9]+)?|roles))/$ {
        proxy_pass http://identidad_publica;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # La clave entre servicios nunca se reenvia por la API publica.
        proxy_set_header X-Internal-Service-Key "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Mantener los codigos y mensajes del backend (incluido 503 de C05).
        proxy_intercept_errors off;
    }

    # 3. Rutas aun no asignadas: NO enviarlas a Identidad.
    #    Las rutas de Catalogo/Circulacion se agregaran en sus commits.
    location / {
        default_type application/json;
        add_header Access-Control-Allow-Origin "http://localhost:4200" always;
        add_header Vary "Origin" always;
        return 404 '{"detail":"Ruta no disponible en el gateway."}';
    }

    # 4. Error del gateway por backend caido o timeout.
    #    No intercepta un 503 de negocio devuelto por Django.
    error_page 502 504 =503 @servicio_no_disponible;

    location @servicio_no_disponible {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin "http://localhost:4200" always;
        add_header Vary "Origin" always;
        return 503 '{"detail":"El servicio requerido no esta disponible temporalmente."}';
    }
}
