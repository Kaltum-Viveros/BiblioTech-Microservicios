server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # No exponer rutas internas.
    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # C02: el unico backend ejecutandose es Identidad.
    # Las rutas de negocio se implementaran en C03-C07.
    location / {
        proxy_pass http://ms-identidad:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    error_page 502 504 =503 @servicio_no_disponible;

    location @servicio_no_disponible {
        internal;
        default_type application/json;

        add_header Access-Control-Allow-Origin "http://localhost:4200" always;
        add_header Vary "Origin" always;

        return 503 '{"detail":"El servicio requerido no esta disponible temporalmente."}';
    }
}