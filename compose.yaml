
services:

  # ==========================================
  # BASE DE DATOS DEL MICROSERVICIO IDENTIDAD
  # ==========================================
  db-identidad:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${IDENTIDAD_DB_NAME:?Configura IDENTIDAD_DB_NAME}
      MYSQL_USER: ${IDENTIDAD_DB_USER:?Configura IDENTIDAD_DB_USER}
      MYSQL_PASSWORD: ${IDENTIDAD_DB_PASSWORD:?Configura IDENTIDAD_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTIDAD_DB_ROOT_PASSWORD:?Configura IDENTIDAD_DB_ROOT_PASSWORD}

    volumes:
      - identidad_mysql_data:/var/lib/mysql

    networks:
      - datos_identidad

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=socket -uroot -Nse "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ==========================================
  # MICROSERVICIO DE IDENTIDAD - DJANGO REST
  # ==========================================
  ms-identidad:
    build:
      context: ./backend/ms-identidad

    restart: unless-stopped

    environment:
      IDENTIDAD_DB_HOST: db-identidad
      IDENTIDAD_DB_PORT: "3306"
      IDENTIDAD_DB_NAME: ${IDENTIDAD_DB_NAME:?Configura IDENTIDAD_DB_NAME}
      IDENTIDAD_DB_USER: ${IDENTIDAD_DB_USER:?Configura IDENTIDAD_DB_USER}
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD:?Configura IDENTIDAD_DB_PASSWORD}

      IDENTIDAD_DJANGO_SECRET_KEY: ${IDENTIDAD_DJANGO_SECRET_KEY:?Configura IDENTIDAD_DJANGO_SECRET_KEY}
      IDENTIDAD_INTERNAL_API_KEY: ${IDENTIDAD_INTERNAL_API_KEY:?Configura IDENTIDAD_INTERNAL_API_KEY}

      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-8}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Mexico_City}
      DJANGO_DEBUG: "1"

    volumes:
      - ./backend/ms-identidad:/app

    ports:
      - "127.0.0.1:18081:8000"

    depends_on:
      db-identidad:
        condition: service_healthy

    networks:
      - api
      - datos_identidad

    command: >
      python manage.py runserver 0.0.0.0:8000 --noreload

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # API GATEWAY
  # ==========================================
  api_gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:80"

    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      ms-identidad:
        condition: service_healthy

    networks:
      - api

  # ==========================================
  # FRONTEND ANGULAR ORIGINAL
  # ==========================================
  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:4200:4200"

    depends_on:
      api_gateway:
        condition: service_started

    networks:
      - api

    command: >
      ng serve --host 0.0.0.0 --poll 2000


# ==========================================
# REDES
# ==========================================
networks:
  api:

  datos_identidad:
    internal: true


# ==========================================
# VOLUMEN PERSISTENTE DE IDENTIDAD
# ==========================================
volumes:
  identidad_mysql_data:
